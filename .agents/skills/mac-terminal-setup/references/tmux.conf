# ~/.tmux.conf —— 面向 LLM 开发 / 训练机工作流的现代默认配置。
#
# 每个块的存在理由都写在它旁边了。删除一行之前，先读注释。

# ============================================================
#  Prefix：改成 Ctrl-a
#  （Ctrl-b 对左手小指不友好，且会和嵌套 shell 里的 readline backward-char 冲突）
# ============================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix    # 连按两次 Ctrl-a 可以发送字面的 Ctrl-a（嵌套 tmux / readline 用得到）

# ============================================================
#  基础默认值
# ============================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"  # 在 Ghostty 里启用真彩色
set -g history-limit 100000     # 每个 pane 10 万行滚动历史
set -sg escape-time 10          # 几乎零 esc 延迟（vim、fzf 受益）
set -g focus-events on          # 让 vim/neovim 知道 tmux 是否有焦点
set -g mouse on                 # 鼠标滚轮翻页、点击切 pane、拖拽改大小
set -g base-index 1             # 窗口编号从 1 开始（贴合键盘布局）
setw -g pane-base-index 1
set -g renumber-windows on      # 关掉 1,2,3 中的窗口 2 → 自动重排成 1,2，无空洞
set -g set-clipboard on         # OSC52：tmux 选区 → 系统剪贴板（即使在 SSH 里也有效）
setw -g mode-keys vi            # copy 模式用 vi 风格按键

# ============================================================
#  快速重载配置（边迭代边调试用）
# ============================================================
bind r source-file ~/.tmux.conf \; display "已重载 ~/.tmux.conf"

# ============================================================
#  分屏：用 | / - 比 % / " 更直观，并且新 pane 继承当前目录
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"   # 新窗口也继承 cwd

# ============================================================
#  Pane 切换：prefix + h/j/k/l（vim 风格）
# ============================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane 大小调整（可重复按：长按修饰键即可连按）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
#  复制模式 —— 这是新手最常被卡住的地方
# ============================================================
# 加载本配置后的复制行为：
#   • 鼠标滚轮向上 → 自动进入复制模式
#   • 鼠标拖拽 → 选择文本（vi 模式），松开鼠标后**同时**写入 tmux 缓冲区和
#                 macOS 剪贴板（通过 pbcopy）
#   • 在复制模式中单击任何位置 → 退出复制模式并清除选区
#                 （这是现代终端的 UX；旧版 tmux 是松开就复制并保留模式）
#   • 复制模式中也可以用 vi 键：v 开始选择、y 复制并退出、q 退出
#   • prefix + [ 手动进入复制模式；prefix + ] 粘贴缓冲区内容

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# 单击清除选区但**不**复制，符合现代终端的肌肉记忆
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# 滚轮滚动：每次 3 行平滑滚，而不是默认的 5 行跳跃
bind -T root WheelUpPane   if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "select-pane -t = ; copy-mode -e ; send-keys -M"
bind -T root WheelDownPane if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "select-pane -t = ; send-keys -M"
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# ============================================================
#  状态栏 —— 极简、深色、只显示真正有用的信息
# ============================================================
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#7aa2f7"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left  "#[fg=#bb9af7,bold] #S #[fg=default]│ "
set -g status-right "#[fg=#9ece6a]#(whoami)@#h #[fg=default]│ #[fg=#e0af68]%H:%M #[fg=#7aa2f7]%a %d-%b"

# 窗口列表：非活跃淡显，活跃高亮反色
setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I #W "
setw -g window-status-separator      ""

# Pane 边框：默认深灰，活跃 pane 用蓝色高亮
set -g pane-border-style        "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# ============================================================
#  备注
#  - 想用 tpm 装插件的话，取消下面那段注释，按
#    https://github.com/tmux-plugins/tpm 的说明做。默认配置不依赖任何插件即可工作。
# ============================================================
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # 重启后恢复 session
# set -g @plugin 'tmux-plugins/tmux-continuum'   # 每 15 分钟自动保存 session
# run '~/.tmux/plugins/tpm/tpm'
